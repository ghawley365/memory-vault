services:
  db:
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - -c
      - maintenance_work_mem=1GB
    environment:
      POSTGRES_DB: memory_vault
      POSTGRES_USER: memory_vault
      POSTGRES_PASSWORD: memory_vault
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Host-side port remapped to 55432 to avoid conflicts with other
    # host Postgres services. Container port stays 5432 so the app can
    # still reach it internally via DB_HOST=db / DB_PORT=5432.
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memory_vault -d memory_vault"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ghcr.io/mihaibuilds/memory-vault:1.2.0
    depends_on:
      db:
        condition: service_healthy
    # Host-side port remapped to 18080 to avoid conflicts. Container
    # still listens on 8000 (API_PORT), reachable at http://localhost:18080.
    ports:
      - "18080:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: memory_vault
      DB_USER: memory_vault
      DB_PASSWORD: memory_vault
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_AUTH_ENABLED: "true"
      API_CORS_ORIGINS: "*"
      API_RATE_LIMIT_PER_MIN: "120"
      LOG_LEVEL: "INFO"
    volumes:
      - app_logs:/var/log/memory-vault

volumes:
  pgdata:
  app_logs:
